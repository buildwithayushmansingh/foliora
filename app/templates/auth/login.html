{% extends "base.html" %}
{% block title %}Log in — {{ site.name }}{% endblock %}
{% block content %}
<section class="section build-section">
  <div class="wrap build-wrap auth-wrap">
    <span class="build-eyebrow">Welcome back</span>
    <h1 class="build-h1">Log in</h1>

    {% if error %}<p class="build-error">{{ error }}</p>{% endif %}

    <form method="post" class="build-form">
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" required maxlength="120" value="{{ email }}" placeholder="you@example.com" autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" required placeholder="••••••••">
      </label>
      <div class="build-actions">
        <button type="submit" class="btn">Log in →</button>
      </div>
    </form>

    <p class="auth-switch">Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
  </div>
</section>
{% endblock %}
